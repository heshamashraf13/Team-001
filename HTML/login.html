<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="../CSS/style.css" />

</head>
<body>

<div class="container name-container">
  <div class="row">
    <div class="col pt-5">
      <div class="card profile-card shadow-sm rounded-3 overflow-hidden">
        <div class="cover p-4 d-flex justify-content-between align-items-start">
          <h5 class="welcome mb-1">
            Welcome, <span class="fw-800">Alexa</span>
          </h5>
          <small class="text-muted">Tue, 07 June 2022</small>
          <div class="img-profil">
            <img src="../images/profile.jpeg" alt="profile" class="rounded-circle">
          </div>
        </div>

        <div class="card-body bg-white px-4 pb-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h5 class="mb-0 fw-semibold">Alexa Rawles</h5>
              <small class="text-muted">alexarawles@gmail.com</small>
            </div>
            <button class="btn edit-btn">Edit</button>
          </div>

          <form>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label text-muted small mb-1">Full Name</label>
                <input type="text" class="form-control input-box" placeholder="Enter full name">
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small mb-1">User Name</label>
                <input type="text" class="form-control input-box" placeholder="Enter user name">
              </div>

              <div class="col-md-6">
                <label class="form-label text-muted small mb-1">Gender</label>
                <select class="form-select input-box">
                  <option selected disabled>Select gender</option>
                  <option>Female</option>
                  <option>Male</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small mb-1">Country</label>
                <input type="text" class="form-control input-box" placeholder="Enter your country">
              </div>

              <div class="col-md-6">
                <label class="form-label text-muted small mb-1">Language</label>
                <select class="form-select input-box">
                  <option selected disabled>Select language</option>
                  <option>English</option>
                  <option>Arabic</option>
                  <option>French</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small mb-1">Time Zone</label>
                <select class="form-select input-box">
                  <option selected disabled>Select time zone</option>
                  <option>GMT</option>
                  <option>UTC+2 (Cairo)</option>
                  <option>UTC+3 (Riyadh)</option>
                </select>
              </div>
            </div>
          </form>

          <hr class="my-4">
          <h6 class="fw-semibold mb-3">My Email Address</h6>
          <div class="d-flex align-items-center gap-3 mb-3">
            <div class="icon-box">
              <i class="bi bi-envelope-fill fs-5"></i>
            </div>
            <div>
              <div class="fw-semibold">alexarawles@gmail.com</div>
              <small class="text-muted">1 month ago</small>
            </div>
          </div>

          <button class="btn add-email-btn"> + Add Email Address </button>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
