<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>
  <body>
    <!-- navbar -->
    <div id="navbar"></div>
    <!-- navbar -->

    <div class="cart-section p-3">
      <h1 class="fw-bold mb-4">YOUR CART</h1>
      <section class="container my-5 cart-section">
        <div class="row">
          <div class="col-lg-8">
            <div id="cart-items" class="d-flex flex-cloumn gap-3"></div>
          </div>

          <div class="col-lg-4">
            <div class="border border-rounded p-4 shadow-sm">
              <h5 class="fw-bold mb-3">order summary</h5>

              <p>subtotal: <span id="subtotal">$0</span></p>
              <p>
                discount (-20%):
                <span id="discount" class="text-danger">-$0</span>
              </p>
              <p>delivery: fee <span id="delivery">$15</span></p>

              <hr />

              <h5>total: <span id="total">$0</span></h5>

              <div class="mt-3 d-flex gap-2">
                <input
                  type="text"
                  placeholder="add promo code"
                  class="form-control"
                />
                <button class="btn btn-dark">apply</button>
              </div>

              <button class="btn btn-dark w-100 mt-3">go to checkout</button>
            </div>
          </div>
        </div>
      </section>
    </div>
    <div id="footer"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
      fetch("../components/navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;

          const topBar = document.getElementById("top-bar");
          const closeTopBar = document.getElementById("closeTopBar");

          if (topBar && closeTopBar) {
            closeTopBar.addEventListener("click", () => {
              topBar.style.display = "none";
            });
          } else {
            console.error("Top bar elements not found!");
          }
        });
    </script>
    <script>
      fetch("../components/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
    <script src="../JS/cart.js"></script>
  </body>
</html>
